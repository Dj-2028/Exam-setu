[project]
name = "examsetu-backend"
version = "0.1.0"
description = "ExamSetu AI — Backend API & Worker"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Settings & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "firebase-admin>=6.5.0",

    # AI providers
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",

    # Object storage (S3-compatible for R2)
    "boto3>=1.34.0",

    # Background jobs
    "arq>=0.26.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # PDF & image processing
    "PyMuPDF>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",

    # Cryptography (Ed25519 signing)
    "PyNaCl>=1.5.0",

    # Logging & observability
    "structlog>=24.2.0",
    "sentry-sdk[fastapi]>=2.5.0",

    # Utilities
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
